<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the Sunday Hike · Forage Finder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#10160f;color:#e6eee2;min-height:100vh;display:flex;flex-direction:column}
a{color:#9fd88a}
.hero{background:linear-gradient(135deg,#1d3322,#18221a 60%,#1b2a33);padding:48px 20px 90px;text-align:center}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#c9b56a}
h1{font-size:34px;color:#9fd88a;margin:8px 0 10px;line-height:1.15}
.hero p{color:#c3d1bf;max-width:520px;margin:0 auto}
.card{background:#18221a;border:1px solid #2a3a2c;border-radius:14px;max-width:420px;width:calc(100% - 32px);margin:-60px auto 24px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tabs{display:flex;background:#0f1610;border-radius:8px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;background:none;border:none;color:#8a9a86;font:inherit;font-size:14px;padding:8px;border-radius:6px;cursor:pointer}
.tabs button.on{background:#2f6b3a;color:#e6eee2}
label{display:block;font-size:12px;color:#8a9a86;margin:10px 0 4px}
input{width:100%;font:inherit;font-size:15px;border-radius:8px;border:1px solid #33463a;background:#0f1610;color:#e6eee2;padding:11px}
input:focus{outline:none;border-color:#9fd88a}
.row{display:flex;gap:10px}.row>div{flex:1}
.uname{font-size:13px;color:#c3d1bf;margin-top:12px;background:#0f1610;border-radius:8px;padding:9px 11px}
.uname b{color:#9fd88a;font-family:ui-monospace,Menlo,monospace}
.go{width:100%;margin-top:16px;background:#2f6b3a;border:1px solid #3f8a4c;color:#e6eee2;font:inherit;font-size:16px;font-weight:600;border-radius:8px;padding:12px;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.msg{font-size:13px;margin-top:12px;min-height:18px;text-align:center}
.msg.err{color:#f0a0a0}.msg.ok{color:#9fd88a}
.done{text-align:center;display:none}
.done .big{font-size:44px}
.done h2{color:#9fd88a;margin:6px 0}
.done p{color:#c3d1bf;font-size:14px;margin-bottom:14px}
.btn{display:inline-block;background:#2f6b3a;border:1px solid #3f8a4c;color:#e6eee2;text-decoration:none;border-radius:8px;padding:10px 14px;font-size:14px;margin:4px}
.btn.alt{background:#24332a;border-color:#33463a}
.foot{text-align:center;font-size:12px;color:#8a9a86;padding:10px 20px 30px;margin-top:auto}
</style>
</head>
<body>
<div class="hero">
<div class="kicker">Sunday, November 29 · Carolina Beach &amp; Kure Beach</div>
<h1>🌿 Join the Sunday Forage Walk</h1>
<p>Sign up in ten seconds and you're on the list. Easy trails, coastal plants, and family time.</p>
</div>

<div class="card">
<div id="form">
<div class="tabs"><button id="t-up" class="on">Sign up</button><button id="t-in">Log in</button></div>
<div id="names" class="row">
<div><label for="first">First name</label><input id="first" autocomplete="given-name"></div>
<div><label for="last">Last name</label><input id="last" autocomplete="family-name"></div>
</div>
<div id="userField" style="display:none"><label for="user">Username</label><input id="user" autocapitalize="none" autocomplete="username" placeholder="firstlast"></div>
<div class="uname" id="preview">Your username: <b id="un">firstlast</b></div>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="new-password">
<button class="go" id="go">Sign me up</button>
<div class="msg" id="msg"></div>
</div>
<div class="done" id="done">
<div class="big">🎉</div>
<h2 id="doneTitle">You're on the list!</h2>
<p id="doneText"></p>
<a class="btn" href="hike.html#roster">See who's coming</a>
<a class="btn alt" href="./">Open the map</a>
</div>
</div>
<div class="foot"><a href="hike.html">View the hike plan</a> · <a href="./">Forage Finder map</a></div>

<script>
// Where sign-ups are saved. Set this to the sign-up endpoint once it's connected.
const API_URL = '';

let mode = 'up';
const $ = id => document.getElementById(id);
const makeUser = (f, l) => (f + l).toLowerCase().replace(/[^a-z0-9]/g, '');
function refresh() {
  $('un').textContent = makeUser($('first').value, $('last').value) || 'firstlast';
}
['first','last'].forEach(id => $(id).addEventListener('input', refresh));
$('user').addEventListener('input', e => { e.target.value = e.target.value.toLowerCase().replace(/\s/g,''); });
function setMode(m) {
  mode = m;
  $('t-up').classList.toggle('on', m === 'up');
  $('t-in').classList.toggle('on', m === 'in');
  $('names').style.display = m === 'up' ? 'flex' : 'none';
  $('preview').style.display = m === 'up' ? 'block' : 'none';
  $('userField').style.display = m === 'in' ? 'block' : 'none';
  $('pw').autocomplete = m === 'up' ? 'new-password' : 'current-password';
  $('go').textContent = m === 'up' ? 'Sign me up' : 'Log in';
  msg('');
}
$('t-up').onclick = () => setMode('up');
$('t-in').onclick = () => setMode('in');
function msg(t, cls) { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (cls || ''); }

async function submit() {
  const first = $('first').value.trim(), last = $('last').value.trim(), pw = $('pw').value;
  const username = mode === 'up' ? makeUser(first, last) : $('user').value.trim();
  if (mode === 'up' && (!first || !last)) return msg('Please enter your first and last name.', 'err');
  if (!username) return msg('Please enter your username.', 'err');
  if (pw.length < 4) return msg('Password needs at least 4 characters.', 'err');
  if (!API_URL) return msg('Sign-ups are being connected. Check back shortly!', 'err');
  $('go').disabled = true; msg(mode === 'up' ? 'Adding you to the list…' : 'Logging in…');
  try {
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: mode === 'up' ? 'signup' : 'login', first, last, username, password: pw })
    });
    const js = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(js.error || 'Something went wrong. Try again.');
    try { localStorage.setItem('ff_user', JSON.stringify({ username, name: js.name || first + ' ' + last })); } catch (e) {}
    $('form').style.display = 'none'; $('done').style.display = 'block';
    $('doneTitle').textContent = mode === 'up' ? "You're on the list!" : 'Welcome back!';
    $('doneText').textContent = `Signed in as ${username}. You're on Sunday's list. It may take a minute to appear.`;
  } catch (e) { msg(e.message, 'err'); }
  finally { $('go').disabled = false; }
}
$('go').onclick = submit;
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
